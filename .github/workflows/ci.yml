name: pmcp-servers CI

# Minimal by design. Everything in this repository is illustrative, and
# most of it hard-imports `v05.*` from `pmcp-python`, so a real
# "does it run" job would need the SDK installed as a dependency.
# That dependency is real — this repository genuinely does require
# `pmcp-python` — so it is installed here, and the smoke test below is
# the one thing worth asserting: that the documented
# `PYTHONPATH` recipe in the README actually works.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  smoke:
    name: Documented-setup smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check out the SDK this repository depends on
        # The README documents running these servers from a local
        # checkout of both repositories:
        #
        #   pip install -e pmcp-python
        #   export PYTHONPATH="$PWD/pmcp-python:$PWD/pmcp-servers"
        #
        # so that is what this job tests. An earlier version installed
        # pmcp from its git URL instead, which cannot work while
        # pmcp-python is private -- the clone fails with "could not read
        # Username for 'https://github.com'" -- and which also tested a
        # recipe the README does not document. Fetching the sibling
        # repository, pinned to its main branch, is the closest
        # equivalent that CI can actually perform.
        uses: actions/checkout@v4
        with:
          repository: physicalcontextprotocol/pmcp-python
          path: pmcp-python
          ref: main

      - name: Install the SDK, as the README documents
        run: |
          python -m pip install --upgrade pip
          pip install -e pmcp-python
          pip show pmcp | grep -q "Name: pmcp" \
            || { echo "::error::could not install pmcp-python"; exit 1; }

      - name: Confirm the documented PYTHONPATH recipe works
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/pmcp-python:$GITHUB_WORKSPACE:$PYTHONPATH"
          python -c "import v05; print('v05 importable, so the README recipe holds')"

      - name: Confirm the reference servers parse
        run: |
          python -m compileall -q robot_servers/ reference_impl/ simulator/
          echo "reference servers compile"

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [smoke]
    if: always()
    steps:
      - name: Report status
        run: |
          echo "## pmcp-servers CI Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| smoke | ${{ needs.smoke.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This checks that the documented setup recipe works and that the" >> "$GITHUB_STEP_SUMMARY"
          echo "files parse. It does **not** run the servers, and it is not" >> "$GITHUB_STEP_SUMMARY"
          echo "evidence that any example behaves correctly. Nothing here is" >> "$GITHUB_STEP_SUMMARY"
          echo "hardware-connected." >> "$GITHUB_STEP_SUMMARY"
